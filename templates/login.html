{% extends "base.html" %}

{% block auth_content %}
<div class="auth-container">
    <div class="card auth-card animate-fade-in">
        <div class="auth-form-wrapper">
            <div style="text-align: center; margin-bottom: 2rem;">
                <div style="width: 60px; height: 60px; border-radius: 15px; background: var(--accent); display: inline-flex; align-items: center; justify-content: center; font-size: 24px; color: white; margin-bottom: 1rem;">
                    <i class="fa-solid fa-wallet"></i>
                </div>
                <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Welcome Back</h2>
                <p style="color: var(--text-secondary); font-size: 0.875rem;">Sign in to your Smart Expense account</p>
            </div>

            {% if error %}
            <div style="background: rgba(211, 47, 47, 0.1); border: 1px solid rgba(211, 47, 47, 0.2); color: var(--danger); padding: 0.75rem; border-radius: 8px; margin-bottom: 1.5rem; font-size: 0.875rem; display: flex; align-items: center; gap: 0.5rem;">
                <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
            </div>
            {% endif %}

            <form method="post">
                <div class="form-group">
                    <label><i class="fa-solid fa-user"></i> Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
                </div>
                
                <div class="form-group">
                    <label><i class="fa-solid fa-lock"></i> Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
                </div>

                <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem; margin-top: -0.5rem; margin-bottom: 1rem;">
                    <input type="checkbox" id="rememberMe" name="remember" style="accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer;">
                    <label for="rememberMe" style="margin-bottom: 0; cursor: pointer;">Remember me</label>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    Sign In <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>
            
            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-secondary);">
                <p>Don't have an account? <a href="/register" style="color: var(--accent); text-decoration: none; font-weight: 600;">Register here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
