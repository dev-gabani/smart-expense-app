{% extends "base.html" %}

{% block title %}Set Income{% endblock %}

{% block content %}
<div class="animate-fade-in" style="max-width: 600px; margin: 0 auto;">
    <div class="card">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="width: 64px; height: 64px; border-radius: 16px; background: rgba(16, 185, 129, 0.1); color: var(--success); display: inline-flex; align-items: center; justify-content: center; font-size: 1.75rem; margin-bottom: 1rem;">
                <i class="fa-solid fa-money-bill-wave"></i>
            </div>
            <h2 style="font-size: 1.5rem;">Monthly Income</h2>
            <p style="color: var(--text-secondary); font-size: 0.875rem; margin-top: 0.5rem;">Set your monthly baseline to enable smart budgeting and predictions</p>
        </div>

        <form method="post" class="ajax-form">
            <div class="form-group">
                <label><i class="fa-solid fa-briefcase"></i> Income Source</label>
                <input type="text" name="source" class="form-control" placeholder="e.g. Salary, Rent, Dividends" required>
            </div>
            
            <div class="form-group">
                <label><i class="fa-solid fa-indian-rupee-sign"></i> Amount</label>
                <div style="position: relative;">
                    <span style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-secondary); font-weight: bold;">₹</span>
                    <input type="number" step="0.01" name="income" class="form-control" placeholder="0.00" required style="padding-left: 2.5rem; font-size: 1.25rem; font-weight: 600;">
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1.5rem; padding: 1rem; font-size: 1.125rem;">
                Add Income Record
            </button>
        </form>
    </div>
</div>
{% endblock %}
