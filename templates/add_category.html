{% extends "base.html" %}

{% block title %}Budget Categories{% endblock %}

{% block content %}
<div class="animate-fade-in" style="max-width: 600px; margin: 0 auto;">
    <div class="card">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="width: 64px; height: 64px; border-radius: 16px; background: rgba(59, 130, 246, 0.1); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; font-size: 1.75rem; margin-bottom: 1rem;">
                <i class="fa-solid fa-tags"></i>
            </div>
            <h2 style="font-size: 1.5rem;">Manage Categories</h2>
            <p style="color: var(--text-secondary); font-size: 0.875rem; margin-top: 0.5rem;">Define how your income should be allocated across categories</p>
        </div>

        <form method="post" class="ajax-form">
            <div class="form-group">
                <label><i class="fa-solid fa-pen"></i> Category Name</label>
                <input type="text" name="name" class="form-control" placeholder="e.g. Food, Rent, Savings" required>
            </div>
            
            <div class="form-group">
                <label><i class="fa-solid fa-percent"></i> Allocation Percentage</label>
                <div style="position: relative;">
                    <input type="number" step="0.01" max="100" name="percentage" class="form-control" placeholder="0" required style="padding-right: 2.5rem; font-size: 1.25rem; font-weight: 600;">
                    <span style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-secondary); font-weight: bold;">%</span>
                </div>
                <div style="font-size: 0.75rem; color: var(--text-secondary); margin-top: 0.5rem;">
                    This determines your budget for this category relative to your total income.
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1.5rem; padding: 1rem; font-size: 1.125rem;">
                Save Category
            </button>
        </form>
    </div>
</div>
{% endblock %}
